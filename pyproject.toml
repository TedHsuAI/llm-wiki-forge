[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-wiki-forge"
version = "0.1.0"
description = "Skills and a thin CLI for building LLM Wiki artifacts from C#/.NET repositories."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "LLM Wiki Forge contributors" }
]
keywords = ["llm", "wiki", "csharp", "dotnet", "ai-skills", "code-intelligence"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Documentation",
]

[project.scripts]
llm-wiki = "llm_wiki_forge.cli:main"

[tool.setuptools.packages.find]
include = ["llm_wiki_forge*"]

[tool.setuptools.package-data]
llm_wiki_forge = ["resources/*.py"]
